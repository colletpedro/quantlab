[project]
name = "quantlab"
version = "0.1.0"
description = "Plataforma de backtesting de estratégias sistemáticas."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pedro Collet", email = "pedroocollet@gmail.com" }]
keywords = ["backtesting", "quantitative-finance", "trading"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pymongo>=4.8",
    "yfinance>=0.2.40",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    # Stubs exigidos por `mypy --strict` (RNF-05).
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
    "pytest-randomly>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

# ─────────────────────────────────────────────────────────────────────────────
# ruff — lint + formatação + import sort
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `specs/` fica fora do formatador: esta versão do ruff reescreve blocos
# ```python dentro de Markdown, e as specs são fonte da verdade — ADRs são
# declarados imutáveis em CLAUDE.md §2. Documento normativo não é reformatado
# por ferramenta.
extend-exclude = [".venv", "specs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # regras próprias do ruff
]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

[tool.ruff.lint.flake8-bugbear]
# Typer declara defaults via chamada de função no parâmetro; é idiomático nele.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
docstring-code-format = true

# ─────────────────────────────────────────────────────────────────────────────
# mypy — RNF-05: tipagem verificada em modo estrito
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"
# Sem isto, `tests/conftest.py` e `tests/integration/conftest.py` colidem no
# mesmo nome de módulo ("conftest") e o mypy para antes de checar qualquer
# coisa. Com bases explícitas, cada um vira `tests.conftest` e
# `tests.integration.conftest`.
explicit_package_bases = true
namespace_packages = true

# yfinance não publica stubs nem py.typed.
[[tool.mypy.overrides]]
module = ["yfinance.*", "yfinance"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Sem __init__.py em tests/, nada coloca a raiz do repo em sys.path por
# padrão — "from tests.support import X" falharia com ModuleNotFoundError.
# `pythonpath` resolve isso sem exigir pacote, e é o que permite compartilhar
# um FakeProvider entre tests/unit/ e tests/integration/ (B1, B4, B6 do
# Bloco B) sem duplicar a classe em cada um.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # RNF-06: a suíte default roda offline. Integração exige `make up` e é
    # desmarcada aqui; `make test-integration` sobrescreve este filtro.
    "-m",
    "not integration",
]
markers = [
    "unit: teste isolado, sem I/O e sem rede — roda sempre",
    "integration: exige serviço externo (MongoDB); desmarcado por default",
]

# ─────────────────────────────────────────────────────────────────────────────
# coverage — RNF-02 (v0.2): mínimo de 85% em engine/ e analytics/ (supersede o
# piso de 80% da Fase 1; módulos novos vivem dentro de engine/, decisão D3)
# ─────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
# O piso vale só onde o erro custa dinheiro: o engine e a medição.
# Os demais pacotes não entram no cálculo de propósito.
source_pkgs = ["quantlab.engine", "quantlab.analytics"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
