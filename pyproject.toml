[project]
name = "quantlab"
version = "0.1.0"
description = "Plataforma de backtesting de estratégias sistemáticas."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pedro Collet", email = "pedroocollet@gmail.com" }]
keywords = ["backtesting", "quantitative-finance", "trading"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pymongo>=4.8",
    "yfinance>=0.2.40",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    # Stubs exigidos por `mypy --strict` (RNF-05).
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]
