version: 2

updates:
  # "uv" é ecossistema nativo do Dependabot desde GA em 2025-03: entende
  # pyproject.toml + uv.lock diretamente, em vez de tratar uv como pip.
  # https://github.blog/changelog/2025-03-13-dependabot-version-updates-now-support-uv-in-general-availability/
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Um PR por grupo: bumps de dev não deveriam competir por revisão com
      # bumps de runtime, que mudam o resultado numérico do backtest.
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
